<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medela - Login</title>
    <link rel="stylesheet" href="/custom css/doctorSignup.css">
    <link rel="stylesheet" href="/bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    
</head>
<body style="background-color: #363753;">
  <div class="login-card row g-0">
    <div class="login-left col-md-6 text-center">
      <h5 class="mt-3" style="font-size: 5rem; color: #5cd2c6;"><i class="bi bi-patch-minus-fill"></i><br>MEDELA<p style="font-size: 1rem;">Empowering healthcare through recovery insights.</p></h5>
    </div>

    <div class="login-right col-md-6 px-4" style="background-color: #dfe3ee;">
      <h3 class="mb-4 fw-bold" style="color: #363753;">Login</h3>
      <form id="doctorLogin">
        <div class="mb-3 border border-info rounded">
          <input type="email" id="loginEmail" class="form-control bg-transparent" placeholder="Enter your email" style="font-weight: lighter;">
        </div>
        <div class="mb-3 border border-info rounded">
          <input type="password" id="loginPassword" class="form-control bg-transparent" placeholder="Enter your password" style="font-weight: lighter;">
        </div>
        <button class="btn w-100" style="background-color: #363753; color: #5cd2c6;">Login</button>
        <div class="d-flex justify-content-between align-items-center mb-3">
          <a href="/pages/doctorForgotPassword.html" class="text-decoration-none">Forgot Password?</a>
        </div>
      </form>
      <p class="mt-3 text-center">Don't have an account? <a href="/pages/doctorSignup.html">Sign Up</a></p>
    </div>
  </div>

  <!-- Bootstrap JS -->
   <script src="/js/doctorLogin.js"></script>
  <script src="/bootstrap-5.3.8-dist/js/bootstrap.min.js"></script>
</body>
</html>

</body>
</html>
