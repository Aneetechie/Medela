<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitation - Medela</title>
  <link href="/bootstrap-5.3.8-dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="/custom css/invited.css">

</head>
<body class="bg-light d-flex align-items-center min-vh-100">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-11 col-md-8 col-lg-6 text-center bg-white shadow-sm rounded-3 p-4">
        
        <h5 class="mt-2">
          <i class="bi bi-patch-minus-fill"></i><br>
          MEDELA
        </h5>
        <p class="text-info mb-4" style="font-size: 1rem;">
          Empowering healthcare through recovery insights.
        </p>

        <h1 class="h3 fw-bold">You've been invited</h1>
        <p>
          <strong id="doctorName"></strong> has invited you to share your recovery journey with them.  
          Click below to accept the invitation and get started.
        </p>

        <a href="/pages/patientSignUp.html" 
           class="btn btn-lg w-100 text-white mt-3" 
           style="background-color: #5cd2c6;">
          Accept Invitation
        </a>
      </div>
    </div>
  </div>

  <script src="/js/invited.js"></script>
  <script src="/bootstrap-5.3.8-dist/js/bootstrap.min.js"></script>
</body>
</html>
