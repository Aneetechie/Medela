<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Dashboard</title>
  <link rel="stylesheet" href="/bootstrap-5.3.8-dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/custom css/patientDashboard.css">
</head>
<body>
  <div class="container-fluid px-3 py-2 my-4">
    <div class="d-flex justify-content-between align-items-center flex-wrap mb-4">
      <h5 class="fw-bold mb-0 d-flex align-items-center" style="font-size: 1.5rem; color: var(--secondary-color);">
        <i class="bi bi-patch-minus-fill me-2"></i> MEDELA
      </h5>
      <div class="d-flex align-items-center mt-3 mt-md-0">
        <h1 id="greeting" class="me-3 fs-5 fs-md-5 mb-0"></h1>

        <div class="d-flex flex-column align-items-center" id="profilecard">
          <img
            src="https://www.aidtowomencenter.org/uploads/images/features/bigstock139046330.jpg"
            alt="doctor's photo"
            class="rounded-circle mb-2 shadow"
            style="width: 48px; height: 48px; object-fit: cover;"
          />
          <div class="dropdown">
            <a href="#"
              class="btn btn-sm text-primary-custom dropdown-toggle"
              id="profileDropdown"
              role="button"
              data-bs-toggle="dropdown"
              aria-expanded="false">
              Edit Profile
            </a>
            <ul class="dropdown-menu border-0 shadow-sm dropdown-menu-end" aria-labelledby="profileDropdown">
              <li><a class="dropdown-item text-light" href="#">Change Profile Photo</a></li>
              <li><a class="dropdown-item text-light" href="#">Change Password</a></li>
              <li><hr class="dropdown-divider text-light"></li>
              <li><a class="dropdown-item text-danger fw-bold" href="/pages/doctorLogin.html">Log Out</a></li>
            </ul>
          </div>
        </div>
      </div>
    </div>

    <div class="card card-custom text-white mt-4 shadow-lg"
      style="background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0)), url('/assets/images/photo-1477332552946-cfb384aeaf1c.avif') center/cover no-repeat; min-height: 200px;">
      <div class="card-body d-flex flex-column justify-content-end">
        <h3 class="fs-5 fw-bold">Answer Daily Questionnaire</h3>
        <p class="small">Complete your daily check-in to monitor your recovery.</p>
        <button class="btn text-white fw-bold btn-sm mt-2" data-bs-toggle="modal" data-bs-target="#recoveryModal" style="background-color: #363753;">Start Now</button>
      </div>
    </div>

 
    <section class="mt-5">
      <h3 class="fs-5 fw-bold mb-3">My Reports</h3>
      <div class="row row-cols-1 row-cols-md-1 g-4" id="reportCards">
        
      </div>
    </section>
  </div>

  <!-- recoveryForm MODAL-->

  <div class="modal fade" id="recoveryModal" tabindex="-1" aria-labelledby="recoveryModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title" id="recoveryModalLabel">
          <i class="bi bi-clipboard2-heart me-2"></i>Recovery Questionnaire
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="questionnaire" enctype="multipart/form-data">
          <div class="card text-light px-2 mb-3" style="background-color: #363753;">
            <div class="mb-4 p-3">
              <label class="form-label fw-bold">How would you rate your pain today?</label>
              <input type="range" class="form-range" min="0" max="10" value="5" name="pain_level" id="painRange">
              <small class="text-info">0 = no pain, 10 = worst pain imaginable</small>
              <div>Result: <span id="painValue">5</span></div>
            </div>
          </div>
          <div class="card text-light p-3 mb-3" style="background-color: #363753;">
            <div class="mb-4">
              <label class="form-label fw-bold">What is the level of swelling?</label>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="swelling" id="swelling1" value="No Swelling" required>
                <label class="form-check-label text-light" for="swelling1">No Swelling</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="swelling" id="swelling2" value="Mild">
                <label class="form-check-label text-light" for="swelling2">Mild</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="swelling" id="swelling3" value="Rapid">
                <label class="form-check-label text-light" for="swelling3">Rapid</label>
              </div>
            </div>
          </div>
          <div class="card text-light p-3 mb-3" style="background-color: #363753;">
            <div class="mb-4">
              <label class="form-label fw-bold">What is your energy level?</label>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="energy_level" id="energy1" value="Weak" required>
                <label class="form-check-label text-light" for="energy1">Weak</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="energy_level" id="energy2" value="Moderate">
                <label class="form-check-label text-light" for="energy2">Moderate</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="energy_level" id="energy3" value="Energetic">
                <label class="form-check-label text-light" for="energy3">Energetic</label>
              </div>
            </div>
          </div>
          <div class="card text-light p-3 mb-3" style="background-color: #363753;">
            <div class="mb-4">
              <label class="form-label fw-bold">What is your current mood?</label>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="mood" id="mood1" value="Sad" required>
                <label class="form-check-label text-light" for="mood1">Sad</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="mood" id="mood2" value="Depressed">
                <label class="form-check-label text-light" for="mood2">Depressed</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="mood" id="mood3" value="Indifferent">
                <label class="form-check-label text-light" for="mood3">Indifferent</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="mood" id="mood4" value="Positive">
                <label class="form-check-label text-light" for="mood4">Positive</label>
              </div>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold">How fast is your wound healing?</label>
            <select class="form-select" name="wound_healing" required>
              <option value="">Select</option>
              <option value="Slow">Slow</option>
              <option value="Good">Good</option>
              <option value="Fast">Fast</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">How easily can you move around?</label>
            <select class="form-select" name="mobility" required>
              <option value="">Select</option>
              <option value="I move independently">I move independently</option>
              <option value="I move with some difficulty">I move with some difficulty</option>
              <option value="I need assistance">I need assistance</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">How is your sleep quality?</label>
            <select class="form-select" name="sleep_quality" required>
              <option value="">Select</option>
              <option value="Good">Good</option>
              <option value="Fair">Fair</option>
              <option value="Poor">Poor</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Rate your overall recovery progress</label>
            <select class="form-select" name="overall_recovery" required>
              <option value="">Select</option>
              <option value="Poor">Poor</option>
              <option value="Fair">Fair</option>
              <option value="Good">Good</option>
            </select>
          </div>

          <div class="modal-footer">
            <button type="submit" class="btn btn-primary w-100">Submit Responses</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

  <script src="/bootstrap-5.3.8-dist/js/bootstrap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/patientDashboard.js"></script>
</body>
</html>
