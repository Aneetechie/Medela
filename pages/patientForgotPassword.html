<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body class="d-flex align-items-center min-vh-100 overflow-x-hidden" style="background-color: #363753">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-8 col-lg-5">
        <div class="card w-100 px-3 py-1 mx-auto my-1 shadow-lg border-0 rounded-4">
            <h5 class="fw-bold fs-4 fs-md-3 m-0 p-4" style="font-size: 7rem; color: #5cd2c6;">
            <i class="bi bi-patch-minus-fill" style="color: #5cd2c6;"></i> MEDELA</h5>
          <div class="card-body">
            <h1 class="text-center mb-1 fw-bold text-dark" style="font-size: 1.6rem;">Forgot Password</h1><hr>
            <form id="form">
              <div class="mb-3">
                <input type="email" class="form-control form-control-lg rounded-3 border border-primary" id="confirmEmail" placeholder="Email">
                <div class="text-danger fw-bold" style="font-size: 0.7rem;" id="emailForgotError"></div>
              </div>
              <div class="mb-3">
                <input type="password" class="form-control form-control-lg rounded-3 border border-primary" id="newPassword" placeholder="New password">
                <div class="text-danger fw-bold" style="font-size: 0.7rem;" id="passwordError"></div>
              </div>
              <div class="mb-3">
                <input type="password" class="form-control form-control-lg rounded-3 border border-primary" id="confirmNewPassword" placeholder="Confirm new password">
                <div class="text-danger fw-bold" style="font-size: 0.7rem;" id="confirmPasswordError"></div>
              </div>
              <button id="forgotPasswordBtn" type="button" class="btn w-100 py-2 rounded-3 fw-semibold " style="background-color: #363753; color: #5cd2c6;">
                Continue
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="/bootstrap-5.3.8-dist/js/bootstrap.min.js"></script>
  <script src="/js/patientForgotPassword.js"></script>
</body>
</html>
