<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medela - Sign Up</title>
    <link rel="stylesheet" href="/custom css/index.css">
    <link rel="stylesheet" href="/bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    
</head>
<body style="background-color: #363753;">
  <div class="login-card row g-0">
    <div class="login-left col-md-6 text-center">
      <h5 class="mt-3" style="font-size: 5rem; color: #5cd2c6;"><i class="bi bi-patch-minus-fill"></i><br>MEDELA<p style="font-size: 1rem;">Empowering healthcare through recovery insights.</p></h5>
    </div>

    <div class="login-right col-md-6 px-4" style="background-color: #dfe3ee;">
      <h3 class="mb-4 fw-bold" style="color: #363753;">Sign Up</h3>
      <form id="patientSignup"  class="row">
        
          <input type="text" id="fullname" class="form-control bg-transparent border border-info rounded mb-3" placeholder="Enter your Full name" style="font-weight: lighter;">
          <input type="email" id="email" class="form-control bg-transparent border border-info rounded mb-3" placeholder="Enter your email" style="font-weight: lighter;">
          <input type="text" id="surgeryName" class="form-control bg-transparent border border-info rounded mb-3" placeholder="Type of surgery" style="font-weight: lighter;">
          <input type="date" id="surgeryDate" class="form-control bg-transparent border border-info rounded" placeholder="Surgery date" style="font-weight: lighter;">
          <small class="text-info mt-0" style="font-style: italic;">Date of surgery</small>
          <input type="password" id="password" class="form-control bg-transparent border border-info rounded mt-3 mb-3" placeholder="Enter your password" style="font-weight: lighter;">
          <div class="pb-0 mb-0 mb-1" style="font-size: 0.7rem; color: red;" id="passwordError">
            
          </div>
          <input type="password" id="confirmPassword" class="form-control bg-transparent border border-info rounded mb-3" placeholder="Confirm your password" style="font-weight: lighter;">
          <div class="pb-0 mb-0 mb-1" style="font-size: 0.7rem; color: red;" id="passwordError2">

          </div>
          <button class="btn w-100 fw-bold" style="background-color: #363753; color: #5cd2c6;">Sign Up</button>
        <div class="d-flex justify-content-between align-items-center mb-3">
          <a href="/pages/patientForgotPassword.html" class="text-decoration-none">Forgot Password?</a>
        </div>
      </form>
      <p class="mt-3 text-center">Already have an account? <a href="/pages/patientLogin.html">Login</a></p>
    </div>
  </div>
  <script src="/bootstrap-5.3.8-dist/js/bootstrap.min.js"></script>
  <script src="/js/patientSignUp.js"></script>
</body>
</html>

</body>
</html>
